# Publish the static Astro build to GitHub Pages on every push to main.
# Repo Settings → Pages → Source must be "GitHub Actions".
name: Deploy to GitHub Pages

on:
  # Production branch (Gitflow: release/hotfix land on main).
  push:
    branches: [main]
  # Manual run from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install, build, and upload Pages artifact
        uses: withastro/action@v6
        with:
          # Keep CI on the Node range declared in package.json engines.
          node-version: 20
        # Optional overrides when using a custom domain at the site root:
        # env:
        #   SITE: https://varectra.example
        #   BASE_PATH: /

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
